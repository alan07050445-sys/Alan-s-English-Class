<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>補例句（暫時頁面）</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:50px auto;padding:0 20px;line-height:1.7}button{font-size:18px;padding:14px 22px;border-radius:10px;border:0;background:#8B3120;color:#fff;cursor:pointer}pre{background:#f4f0e8;padding:12px;border-radius:8px;white-space:pre-wrap}</style></head>
<body>
<h2>G4 Week 12「中師額外單字」補例句（暫時頁面）</h2>
<p>只會填入 11 張字卡的「例句」欄位，不改單字、中文、圖片。</p>
<button id="go">登入 Google 並補上例句</button>
<pre id="log">等待中…</pre>
<script src="vendor/firebase-app-compat-9.23.0.js"></script>
<script src="vendor/firebase-firestore-compat-9.23.0.js"></script>
<script src="vendor/firebase-auth-compat-9.23.0.js"></script>
<script>
firebase.initializeApp({ apiKey:'AIzaSyD1fQDneiwkGhbMOUxpOzVxZi8EIkourAs', authDomain:'alan-s-english-class.firebaseapp.com', projectId:'alan-s-english-class' });
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
const WEEK = 'g4-2026F-W12', CAT = 'ltvocab', ITEM = 'qs1795245752451fc';
const EX = {
  'c17952457524510qz9c': "The echidna's beak is a fabulously useful tool.",
  'c17952457524511y512': "The echidna pokes and prods the soil with its beak to find food.",
  'c1795245752451336wy': "An echidna can break open a rotten log to find insects.",
  'c17952457524514ooqh': "Sensors in the echidna's beak detect electrical signals.",
  'c1795245752451597me': "Living creatures give off electrical signals.",
  'c179524575245164pim': "Echidnas can locate insects without seeing them.",
  'c17952457524517g6e7': "Scientists classify echidnas by the length of their beaks.",
  'c179524575245182uos': "Long-beaked echidnas live exclusively on New Guinea.",
  'c17952457524519nylk': "The echidna uses its flexible tongue to catch ants.",
  'c179524575245111gnap': "Torpor is a state similar to hibernation.",
  'c17952457524511253pj': "The echidna's spines are made of keratin."
};
document.getElementById('go').onclick = async () => {
  try {
    await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
    log('已登入 ✓');
    const db = firebase.firestore();
    const ref = db.collection('class').doc('data_g4');
    const res = await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      const arr = (((snap.data().weeks || {})[WEEK] || {}).items || {})[CAT];
      if (!Array.isArray(arr)) throw new Error('找不到 ' + WEEK + ' 的 ' + CAT);
      const idx = arr.findIndex(x => x && x.id === ITEM);
      if (idx < 0) throw new Error('找不到「中師額外單字」這個單元');
      const unit = JSON.parse(JSON.stringify(arr[idx]));
      let n = 0, skipped = [];
      unit.cards = (unit.cards || []).map(c => {
        if (EX[c.id] === undefined) return c;
        if (c.example && String(c.example).trim()) { skipped.push(c.term); return c; }   // 已經有例句就不覆蓋
        n++; return { ...c, example: EX[c.id] };
      });
      const next = arr.slice(); next[idx] = unit;
      tx.update(ref, { ['weeks.' + WEEK + '.items.' + CAT]: next });
      return { n, skipped };
    });
    log('完成 ✓ 已補上 ' + res.n + ' 張的例句' + (res.skipped.length ? '；本來就有例句所以沒動：' + res.skipped.join(', ') : '') + '。');
  } catch (e) { log('錯誤：' + (e.message || e)); }
};
</script></body></html>
