<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>G4 還原</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 20px;line-height:1.7}button{font-size:18px;padding:14px 22px;border-radius:10px;border:0;background:#8B3120;color:#fff;cursor:pointer}pre{background:#f4f0e8;padding:12px;border-radius:8px;white-space:pre-wrap}</style></head>
<body>
<h2>G4 還原（暫時頁面）</h2>
<p>把 G4 還原成 11/21 14:33 之前的內容，並刪除舊種子週 Week 1～8。</p>
<button id="go">登入 Google 並還原</button>
<pre id="log">等待中…</pre>
<script src="vendor/firebase-app-compat-9.23.0.js"></script>
<script src="vendor/firebase-firestore-compat-9.23.0.js"></script>
<script src="vendor/firebase-auth-compat-9.23.0.js"></script>
<script>
firebase.initializeApp({ apiKey:'AIzaSyD1fQDneiwkGhbMOUxpOzVxZi8EIkourAs', authDomain:'alan-s-english-class.firebaseapp.com', projectId:'alan-s-english-class' });
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
const conv = (v) => {
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(conv);
  if ('mapValue' in v) { const o = {}, f = v.mapValue.fields || {}; Object.keys(f).forEach(k => o[k] = conv(f[k])); return o; }
  throw new Error('未知型別');
};
document.getElementById('go').onclick = async () => {
  try {
    const cred = await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
    log('已登入 ✓');
    const ref = firebase.firestore().collection('class').doc('data_g4');
    const cur = (await ref.get()).data() || {};
    if ((cur.weekOrder || []).some(x => /2026F-W/.test(x))) { log('雲端目前已有 2026F 週次，為避免覆蓋，停止。'); return; }
    const r = await fetch('https://firestore.googleapis.com/v1/projects/alan-s-english-class/databases/(default)/documents/class/data_g4?readTime=2026-11-21T06:33:00Z');
    if (!r.ok) { log('抓不到備份：' + r.status); return; }
    const f = (await r.json()).fields;
    const weekOrder = conv(f.weekOrder), weeks = conv(f.weeks);
    const n = Object.values(weeks).reduce((s, w) => s + Object.values(w.items || {}).reduce((a, x) => a + x.length, 0), 0);
    log('備份：' + weekOrder.length + ' 週、' + n + ' 個單元。寫入中…');
    await ref.set({ weekOrder, weeks }, { merge: true });
    const seeds = Object.keys((await ref.get()).data().weeks || {}).filter(k => /^g4-2026-W\d+$/.test(k));
    const upd = {}; seeds.forEach(k => upd['weeks.' + k] = firebase.firestore.FieldValue.delete());
    if (seeds.length) await ref.update(upd);
    const after = (await ref.get({ source: 'server' })).data();
    log('完成 ✓ 現在雲端：' + (after.weekOrder || []).length + ' 週；已刪除舊種子週：' + seeds.join(', '));
  } catch (e) { log('錯誤：' + (e.message || e)); }
};
</script></body></html>
