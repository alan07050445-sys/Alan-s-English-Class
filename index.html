<!-- 🎊 節慶限定外觀：整份包在 html.fest-XXXX 底下，class 沒掛上去就完全不作用。
     一定要排在最後——它的工作就是覆寫前面所有樣式。
     v508 起改成「只有節慶那幾天才載」：整張 CSS 全部包在節慶 class 底下，
     一年裡有 330 天是每個學生每次載入都下載、解析、然後一條都不生效的死重量。
     判斷條件跟 data.js 的 festNow() 完全一樣（日期區間 ＋ 老師那台裝置的強制開關），
     只是提早到 <head> 做，因為 CSS 必須在 React 掛載前就到位。
     ⚠ 這一段不可以依賴 data.js（它比這裡晚載入），所以節慶表在這裡抄了一份；
       tests/t-v489.mjs 會比對兩邊的區間與檔名有沒有走鐘。 -->
<script>
  (function () {
    try {
      var F = [
        { id: '1010', from: '10-08', to: '10-12', css: 'styles-holiday.css' },
        { id: 'hw',   from: '10-20', to: '10-31', css: 'styles-holiday-hw.css' }
      ];
      var ov = null;
      try { ov = localStorage.getItem('alan-fest-override'); } catch (e) {}
      var d = new Date();
      var md = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var hit = null, i;
      for (i = 0; i < F.length; i++) if (md >= F[i].from && md <= F[i].to) { hit = F[i]; break; }
      if (ov === 'off') hit = null;
      else if (ov && ov !== 'auto' && ov !== 'on') {
        for (i = 0; i < F.length; i++) if (F[i].id === ov) hit = F[i];
      } else if (ov === 'on' && !hit) hit = F[F.length - 1];
      if (hit) {
        var l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = hit.css + '?v=577';
        document.head.appendChild(l);
      }
    } catch (e) {}
  })();
</script>
