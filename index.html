<!-- ⚡ 載入速度最大的一刀：叫 Babel 只做 JSX 轉換，不要降轉到 ES5。
     @babel/standalone 對沒帶 data-presets 的 text/babel tag，預設是 presets:['react','env']
     ＋ class-properties / object-rest-spread / flow-strip-types ＋ sourceMaps:'inline'，
     targets 又是空的 ＝ 全部降轉到 ES5 並內嵌一大包 base64 sourcemap。
     實測轉譯這 9 個檔（同一支 babel.min.js，M2 / node 22）：
        預設（react+env）                6050ms／4,609,804 bytes
        presets=react                    1397ms／3,962,296 bytes
        presets=react + block-scoping    1460ms／3,957,523 bytes  ← 本檔採用
     瀏覽器端「畫面真的出來」的時間（本機同一台、各跑數次）：改前 3661／2989ms，
     改後 1537／997／998ms，大約快 3 倍。省下來的全是 Babel 佔住主執行緒的時間。
     安全性：全站只用到 optional chaining（142 處）與 async/await（59 處），沒有 class、
     decorator、private field、TS/Flow 型別、import/export；這兩種語法 Safari 13.4 /
     Chrome 80（2020）以上都原生支援，學生用的裝置遠比這新。

     ⚠ 為什麼 data-plugins 不是空字串，而是留下 transform-block-scoping 這一個：
     這 9 個檔轉譯完是「9 個獨立 <script> 掛在同一個全域範圍」。preset-env 本來會把
     頂層的 const/let 全部變成 var，而 var 允許重複宣告，所以底下這組既有的撞名一直被蓋住：
        components-quiz.jsx:3       const { useMemo:  useQM } = React;
        components-quiz-mode.jsx:3  const { useState: useQM } = React;
     一旦頂層維持 const，第二個檔就會丟
     「SyntaxError: Identifier 'useQM' has already been declared」，整個 app 直接掛掉
     （已在瀏覽器實測撞到）。transform-block-scoping 把 const/let 還原成 var，
     等於完整保留 v391 的作用域行為，實測只多 63ms（1397ms → 1460ms），
     跟原本的 6050ms 相比仍然是 4 倍以上的改善。
     ＊真正的根治是把 components-quiz.jsx 的 useQM 改名，那要動 .jsx，另外排。 -->
<script type="text/babel" data-presets="react" data-plugins="transform-block-scoping" src="components-shell.jsx?v=409"></script>
