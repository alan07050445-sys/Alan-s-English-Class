<!-- 🎊 節慶限定外觀：整份包在 html.fest-XXXX 底下，class 沒掛上去就完全不作用。
     一定要排在最後——它的工作就是覆寫前面所有樣式。
     v508 起改成「只有節慶那幾天才載」：整張 CSS 全部包在節慶 class 底下，
     一年裡有 330 天是每個學生每次載入都下載、解析、然後一條都不生效的死重量。
     判斷條件跟 data.js 的 festNow() 完全一樣（日期區間 ＋ 老師那台裝置的強制開關），
     只是提早到 <head> 做，因為 CSS 必須在 React 掛載前就到位。
     ⚠ 這一段不可以依賴 data.js（它比這裡晚載入），所以節慶表在這裡抄了一份；
       tests/t-v489.mjs 會比對兩邊的區間與檔名有沒有走鐘。 -->
<script>
  (function () {
    try {
      var F = [
        { id: '1010', from: '10-08', to: '10-12', css: 'styles-holiday.css' },
        { id: 'hw',   from: '10-20', to: '10-31', css: 'styles-holiday-hw.css' }
      ];
      var ov = null;
      try { ov = localStorage.getItem('alan-fest-override'); } catch (e) {}
      var d = new Date();
      var md = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var hit = null, i;
      for (i = 0; i < F.length; i++) if (md >= F[i].from && md <= F[i].to) { hit = F[i]; break; }
      if (ov === 'off') hit = null;
      else if (ov && ov !== 'auto' && ov !== 'on') {
        for (i = 0; i < F.length; i++) if (F[i].id === ov) hit = F[i];
      } else if (ov === 'on' && !hit) hit = F[F.length - 1];
      if (hit) {
        var l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = hit.css + '?v=627';
        document.head.appendChild(l);
      }
    } catch (e) {}
  })();
</script>

<!-- ⚡ v508（Alan：「有小朋友反應登入頁面跟到第二頁以及第三頁…轉換畫面還是會卡卡的」）

     ⚠ 轉譯參數跟以前完全一致，尤其 transform-block-scoping：這 9 個檔共用同一個全域範圍，

<!-- ⚡ v594：老師專用的兩包（出題／編輯視窗 components-editor ＝ 148KB、後台 components-dashboard ＝ 64KB，
     v599 起再加上 data.js 老師專用的那一半約 170KB；壓縮後合計約 380KB，是學生原本要下載的程式的將近一半）**只有老師才載**。
     app.jsx 確認登入的人是老師之後才呼叫 loadTeacherBundle()；學生與訪客永遠不會下載它。
     ⚠ 載入順序跟以前一樣（editor → dashboard），而且一個載完才載下一個——它們以前就是這個順序。
     ⚠ 這兩個檔案刻意不放進 service worker 的預先快取（那會讓每個學生都下載一次）；
       老師第一次載入後由 service worker 的「用到才快取」接手，之後也是即時的。 -->
<script>
  window.loadTeacherBundle = function () {
    if (window.__teacherBundle) return window.__teacherBundle;
    var load = function (src) {
      return new Promise(function (ok, bad) {
        var s = document.createElement('script');
        s.src = src; s.async = false;
        s.onload = ok;
        s.onerror = function () { bad(new Error('load ' + src)); };
        document.head.appendChild(s);
      });
    };
    /* v600：老師專用的樣式（跟 JS 同時下載，全部到了才算載好，才不會先看到沒樣式的老師畫面）。
       ⚠ 插在對應那張「學生樣式」的正後面——原本它們是同一張表裡的前後段，層疊順序要盡量不變。
       這份名單要跟 dist/css/*.teacher.css 一致（tests/t-v600 會比對）。 */
    var T_CSS = ['styles', 'styles-part2', 'styles-quiz', 'styles-flashcard', 'styles-auth', 'styles-quiz-mode', 'styles-mistakes', 'styles-home', 'styles-theme', 'styles-tune'];
    var loadCss = function (name) {
      return new Promise(function (ok) {
        var l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = 'dist/css/' + name + '.teacher.css?v=627';
        l.onload = l.onerror = function () { ok(); };      // 樣式失敗不擋老師用（只是醜）
        var core = document.querySelector('link[href^="dist/css/' + name + '.css"]');
        if (core && core.parentNode) core.parentNode.insertBefore(l, core.nextSibling); else document.head.appendChild(l);
      });
    };
    var cssP = Promise.all(T_CSS.map(loadCss));
    window.__teacherBundle = load('dist/data-teacher.js?v=627')      /* v599：data.js 裡老師專用的那一半，要排在 editor 前面 */
      .then(function () { return load('dist/components-editor.js?v=627'); })
      .then(function () { return load('dist/components-dashboard.js?v=627'); })
      .then(function () { return cssP; })
      .catch(function (e) { window.__teacherBundle = null; throw e; });   // 失敗了下次可以再試
    return window.__teacherBundle;
  };
</script>
